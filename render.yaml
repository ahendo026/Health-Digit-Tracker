services:
  - type: web
    name: healthdigits-api
    runtime: node
    buildCommand: pnpm install && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AI_INTEGRATIONS_ANTHROPIC_API_KEY
        sync: false
      - key: GCS_CREDENTIALS_JSON
        sync: false
      - key: PRIVATE_OBJECT_DIR
        sync: false

  - type: static
    name: healthdigits-frontend
    buildCommand: pnpm install && BASE_PATH=/ pnpm --filter @workspace/health-digit run build
    staticPublishPath: artifacts/health-digit/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: BASE_PATH
        value: /
